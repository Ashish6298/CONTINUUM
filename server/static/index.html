<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continuum — AI Work Continuity Control Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
  <!-- Header & Navigation -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-logo">
        <span class="logo-symbol">∞</span>
        <span class="logo-text">CONTINUUM</span>
      </div>
      <span class="version-badge" id="appVersion">v1.2.0</span>
      <div class="status-indicator online" id="connectionStatus">
        <span class="dot"></span>
        <span class="status-text">Daemon Connected</span>
      </div>
    </div>
    
    <div class="header-right">
      <div class="workspace-pill" id="workspacePath" title="Active Workspace">
        <span class="icon">📁</span>
        <span class="path-text">Loading workspace...</span>
      </div>
      <button class="btn btn-outline btn-sm" id="btnRefresh" title="Refresh State">
        <span class="btn-icon">🔄</span> Refresh
      </button>
      <button class="btn btn-primary btn-sm" id="btnExport" title="Download Handoff Package">
        <span class="btn-icon">📦</span> Export Handoff
      </button>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="dashboard-grid">
    <!-- Top Stats Row -->
    <section class="stats-row">
      <div class="stat-card glass-panel">
        <div class="stat-icon">📊</div>
        <div class="stat-details">
          <span class="stat-value" id="statFiles">0</span>
          <span class="stat-label">Source Files</span>
        </div>
      </div>
      <div class="stat-card glass-panel">
        <div class="stat-icon">🧩</div>
        <div class="stat-details">
          <span class="stat-value" id="statSymbols">0</span>
          <span class="stat-label">AST Symbols</span>
        </div>
      </div>
      <div class="stat-card glass-panel">
        <div class="stat-icon">🛡️</div>
        <div class="stat-details">
          <span class="stat-value" id="statConfidence">100%</span>
          <span class="stat-label">Confidence Score</span>
        </div>
      </div>
      <div class="stat-card glass-panel">
        <div class="stat-icon">🌿</div>
        <div class="stat-details">
          <span class="stat-value" id="statGitBranch">main</span>
          <span class="stat-label">Git Branch</span>
        </div>
      </div>
    </section>

    <!-- Workspace Explorer & Token Budget -->
    <div class="workspace-layout">
      <!-- Left: File Selector & Toggles -->
      <aside class="sidebar-panel glass-panel">
        <div class="panel-header">
          <h3>Workspace Files</h3>
          <span class="badge" id="fileCountBadge">0</span>
        </div>
        <div class="file-filter-bar">
          <input type="text" id="fileSearchInput" placeholder="Filter files..." class="input-search">
        </div>
        <div class="file-list-container" id="fileListContainer">
          <div class="loading-spinner">Loading files...</div>
        </div>
        
        <!-- Context Inclusion Options -->
        <div class="panel-section">
          <h4>Context Inclusions</h4>
          <label class="toggle-option">
            <input type="checkbox" id="chkIncludeDiff" checked>
            <span>🌿 Include Live Git Diffs</span>
          </label>
          <label class="toggle-option">
            <input type="checkbox" id="chkIncludeSymbols" checked>
            <span>🧩 Include AST Symbol Table</span>
          </label>
          <label class="toggle-option">
            <input type="checkbox" id="chkIncludeConfidence" checked>
            <span>⚖️ Include Ground-Truth Proof</span>
          </label>
        </div>
      </aside>

      <!-- Center: Prompt Composer & Live Preview -->
      <section class="main-composer-panel glass-panel">
        <div class="composer-header">
          <div class="model-selector-group">
            <span class="label">Target Platform:</span>
            <button class="model-btn active" data-model="universal">🌐 Universal</button>
            <button class="model-btn" data-model="claude">🟣 Claude</button>
            <button class="model-btn" data-model="gpt">🟢 ChatGPT / Codex</button>
            <button class="model-btn" data-model="gemini">🔵 Gemini Pro</button>
          </div>
          <div class="composer-actions">
            <button class="btn btn-secondary btn-sm" id="btnCopyPrompt">
              <span class="btn-icon">📋</span> Copy Prompt
            </button>
          </div>
        </div>

        <div class="task-input-section">
          <input type="text" id="taskInput" placeholder="Enter specific task directive for the AI agent (optional)..." class="input-task">
        </div>

        <!-- Token Meter Bar -->
        <div class="token-meter-bar">
          <div class="token-labels">
            <span class="token-count-text">Estimated Payload: <strong id="tokenCount">0</strong> tokens</span>
            <span class="model-limit-text" id="tokenLimitRatio">0.0% of Claude 3.5 limit</span>
          </div>
          <div class="meter-track">
            <div class="meter-fill" id="meterFill" style="width: 2%;"></div>
          </div>
        </div>

        <!-- Prompt Preview Box -->
        <div class="preview-container">
          <pre><code id="promptPreviewText" class="code-preview">Loading live context...</code></pre>
        </div>
      </section>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/dashboard.js"></script>
</body>
</html>
