[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-ai"
version = "0.1.0"
description = "AI Work Continuity & Agent Handoff System"
readme = "README.md"
authors = [{ name = "Project Continuum Team" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
continuum = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
