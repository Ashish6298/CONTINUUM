name: CI Pipeline

on:
  push:
    branches: [ main, ashish ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Package in Editable Mode
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e ".[dev]"

      - name: Execute Full 24-Phase Test Suite (126 Tests)
        run: |
          python tests/run_all_tests.py

      - name: Verify CLI Command Suite & Subcommands
        run: |
          continuum --help
          continuum init --path .
          continuum scan --path .
          continuum status --path .
          continuum graph --stats
          continuum handoff --model universal

      - name: Build Source Distribution & Wheel Artifacts
        run: |
          python -m build
