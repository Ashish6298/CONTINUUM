name: CI Pipeline

on:
  push:
    branches: [ main, ashish ]
  pull_request:
    branches: [ main, ashish ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Build Tools & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -e .

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall -q core storage server handoff extractors cli

      - name: Execute Full Test Suite (507+ Tests)
        run: |
          python tests/run_all_tests.py

      - name: Verify CLI Command Suite & Subcommands
        run: |
          python cli/main.py --help
          python cli/main.py init --path .
          python cli/main.py scan --path .
          python cli/main.py status --path .
          python cli/main.py graph --stats
          python cli/main.py handoff --model universal

      - name: Build Source Distribution & Wheel Artifacts
        run: |
          python -m build
